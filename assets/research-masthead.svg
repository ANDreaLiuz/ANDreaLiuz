<title id="title">Two research questions — original conceptual masthead</title>
<desc id="desc">An original conceptual portfolio masthead, not a research figure. The left ivory and green field names 48+N and human agency in embodied systems. The right violet field names Music Cultural Genealogy with abstract waves and undirected dots. No experimental data, research result, historical ancestry or complete robot loop is represented.</desc>
